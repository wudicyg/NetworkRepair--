name: CI

on:
  push:
  pull_request:

concurrency:
  group: networkrepair-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List *; throw "Syntax errors found in $($file.FullName)" }
          }
      - name: Install Pester
        run: Install-Module Pester -RequiredVersion 5.9.1 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run Pester
        run: Invoke-Pester .\tests\NetworkRepair.Tests.ps1 -Output Detailed
  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List *; throw "Syntax errors found in $($file.FullName)" }
          }
      - name: Install Pester
        run: Install-Module Pester -RequiredVersion 5.9.1 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run Pester
        run: Invoke-Pester .\tests\NetworkRepair.Tests.ps1 -Output Detailed

  release-package:
    name: Release package smoke test
    needs:
      - powershell-51
      - powershell-7
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - name: Install ps2exe
        run: Install-Module ps2exe -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Build release package
        run: |
          $result = & .\tools\New-NRReleasePackage.ps1 -OutputDirectory .\release-check | ConvertFrom-Json
          if (-not $result.Success) { throw 'Release package build failed.' }
          if (-not (Test-Path -LiteralPath $result.Package)) { throw 'Release ZIP was not created.' }
          if (-not (Test-Path -LiteralPath $result.Sha256)) { throw 'Release SHA-256 file was not created.' }
          Write-Host "Entry: $($result.EntryName)"
          Write-Host "Inlined modules: $($result.InlinedModules)"
          Write-Host "Elevation manifest verified: $($result.ElevationVerified)"

      - name: Inspect release package contents
        run: |
          # Verification lives in a BOM-protected repository script so this run step stays pure ASCII.
          # PowerShell 5.1 would otherwise mis-decode the runner's own temporary script file.
          & .\tools\Test-NRReleasePackage.ps1 -PackageOutputDirectory .\release-check -RequireExecutable -VerifyEntryRuns

      - name: Validate release workflow safety
        run: |
          if (-not (Select-String -LiteralPath .\.github\workflows\release.yml -Pattern 'RELEASE_IS_PRERELEASE' -Quiet)) {
            throw 'Release workflow prerelease detection is missing.'
          }
          if (-not (Select-String -LiteralPath .\.github\workflows\release.yml -Pattern '--prerelease' -Quiet)) {
            throw 'Release workflow prerelease publishing guard is missing.'
          }
          if (-not (Select-String -LiteralPath .\.github\workflows\release.yml -Pattern '--verify-tag' -Quiet)) {
            throw 'Release workflow tag verification is missing.'
          }
      - name: Verify single-file entry actually runs
        run: |
          # Console build: stdout is observable, so the version banner can be asserted.
          $console = & .\tools\New-NRSingleFileDistribution.ps1 -OutputDirectory .\dist-console -Console -NoElevationManifest | ConvertFrom-Json
          if (-not $console.Success) { throw ('Console distribution build failed: {0}' -f $console.ExecutableError) }
          if (-not (Test-Path -LiteralPath $console.Executable)) { throw 'Console executable was not produced.' }

          $exeOutput = (& $console.Executable -Mode Version) -join ' '
          if ($exeOutput -notmatch 'NetworkRepair v') { throw ('Unexpected console executable output: {0}' -f $exeOutput) }

          $scriptOutput = (& powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File $console.SingleScript -Mode Version) -join ' '
          if ($scriptOutput -notmatch 'NetworkRepair v') { throw ('Unexpected single-file script output: {0}' -f $scriptOutput) }

          Write-Host ('Console executable output: {0}' -f $exeOutput)
          Write-Host ('Single-file script output: {0}' -f $scriptOutput)

      - name: Verify graphical executable builds and starts
        run: |
          # Windowed build (the shipped one): no console, so readiness is proven by exit code.
          $gui = & .\tools\New-NRSingleFileDistribution.ps1 -OutputDirectory .\dist-gui -NoElevationManifest | ConvertFrom-Json
          if (-not $gui.Success) { throw ('Graphical distribution build failed: {0}' -f $gui.ExecutableError) }
          if ($gui.DefaultMode -ne 'Gui') { throw ('Graphical build default mode is not Gui: {0}' -f $gui.DefaultMode) }

          $process = Start-Process -FilePath $gui.Executable -ArgumentList '-Mode','GuiSmoke' -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Graphical executable did not exit within 120s: a modal output dialog is likely blocking it.'
          }
          if ($process.ExitCode -ne 0) { throw ('Graphical interface smoke test failed with exit code {0}.' -f $process.ExitCode) }
          Write-Host 'Graphical interface smoke test passed.'
