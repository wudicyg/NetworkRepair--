name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: netmedic-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches application version
        run: |
          $content = Get-Content .\NetworkRepair.ps1 -Raw -Encoding UTF8
          $pattern = '\$Script:AppVersion\s*=\s*''([^'']+)'''
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) { throw 'Unable to determine application version.' }
          $version = $match.Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $version) {
            throw "Tag version $tagVersion does not match application version $version."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Application version '$version' is not a supported release version."
          }
          $isPrerelease = $version -match '-'
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release version: $version"
          Write-Host "Prerelease: $isPrerelease"

      - name: Install Pester
        run: Install-Module Pester -RequiredVersion 5.9.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester
        run: Invoke-Pester .\tests\NetworkRepair.Tests.ps1 -Output Detailed

      - name: Install ps2exe
        run: Install-Module ps2exe -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Build release package
        run: |
          $result = & .\tools\New-NRReleasePackage.ps1 -OutputDirectory .\release | ConvertFrom-Json
          if (-not $result.Success) { throw 'Release package build failed.' }
          Write-Host "Package: $($result.Package)"
          Write-Host "SHA256: $($result.Sha256Value)"
          Write-Host "Entry: $($result.EntryName)"
          Write-Host "Portable exe: $($result.PortableExe)"
          Write-Host "Elevation manifest verified: $($result.ElevationVerified)"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetMedic-${{ github.ref_name }}
          path: |
            release/*.zip
            release/*.sha256
            release/*.exe
          if-no-files-found: error

      - name: Build release notes from the changelog
        run: |
          # Auto generated notes only list pull request titles, which tells a user almost
          # nothing about what changed. The changelog section is written for humans, so it
          # becomes the release body, together with guidance on which file to download.
          $result = & .\tools\Get-NRReleaseNotes.ps1 -Version $env:RELEASE_VERSION -OutputPath .\release\RELEASE-NOTES.md | ConvertFrom-Json
          if (-not $result.Success) { throw 'Release notes generation failed.' }
          Write-Host "Release notes: $($result.OutputPath) ($($result.Bytes) bytes)"

      - name: Create GitHub release
        run: |
          $zip = Get-ChildItem .\release\*.zip | Select-Object -First 1
          if (-not $zip) { throw 'Release ZIP not found.' }
          $zipSha = Get-ChildItem .\release\*.sha256 | Where-Object { $_.BaseName -eq $zip.BaseName } | Select-Object -First 1
          $portable = Get-ChildItem .\release\*.exe | Select-Object -First 1
          if (-not $portable) { throw 'Portable single-file executable was not produced.' }
          $portableSha = Get-ChildItem .\release\*.sha256 | Where-Object { $_.BaseName -eq $portable.BaseName } | Select-Object -First 1
          if (-not $zipSha -or -not $portableSha) { throw 'Release checksum files not found.' }
          $notes = Join-Path (Get-Location) 'release\RELEASE-NOTES.md'
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes file was not produced.' }

          $releaseArgs = @(
            'release'
            'create'
            $env:GITHUB_REF_NAME
            $zip.FullName
            $zipSha.FullName
            $portable.FullName
            $portableSha.FullName
            '--title'
            "NetMedic $env:GITHUB_REF_NAME"
            '--notes-file'
            $notes
            '--verify-tag'
          )
          if ($env:RELEASE_IS_PRERELEASE -eq 'true') {
            $releaseArgs += '--prerelease'
          }

          gh @releaseArgs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Chinese asset labels
        run: |
          # GitHub strips non-ASCII characters from release asset names, so the Chinese
          # display names are applied as asset labels by a BOM-protected repository script.
          & .\tools\Set-NRReleaseAssetLabels.ps1 -Tag $env:GITHUB_REF_NAME
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
